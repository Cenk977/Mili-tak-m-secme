[pytest]
# Pytest configuration for Milli Takım Seçme

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for test categorization
markers =
    integration: Integration tests (full pipeline)
    unit: Unit tests (single component)
    slow: Slow-running tests
    requires_real_data: Tests requiring real LXF files

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Coverage
[coverage:run]
source = .
omit =
    */tests/*
    */venv/*
    setup.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
